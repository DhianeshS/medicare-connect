version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: medicare-db
    environment:
      MYSQL_DATABASE: medicare_connect
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1.sql
      - ./backend/src/main/resources/data.sql:/docker-entrypoint-initdb.d/2.sql

  backend:
    build: ./backend
    container_name: medicare-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/medicare_connect
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: medicare-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
